name: ElytrymFly
version: '${project.version}'
main: LIKGER.elytrymFly.ElytrymFly
api-version: '1.21'
authors: [ LIKGER ]
softdepend: [ CombatLogX, GreatCombat ]
permissions:
  elytrymfly.use:
    description: Allows use of /ffly command
    default: op
  elytrymfly.bypass:
    description: Allows flying without elytra and ignores durability/world/cooldown restrictions
    default: op
  elytrymfly.admin:
    description: Allows use of admin commands (reload, status)
    default: op
commands:
  ffly:
    description: Toggle flight with elytra
    permission: elytrymfly.use
  elytrymfly:
    description: ElytrymFly admin commands
    permission: elytrymfly.admin
